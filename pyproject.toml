[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dorsal-whisper"
version = "0.5.0"
description = "Dorsal model: dorsal-whisper"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "dorsalhub>=0.13.3,<0.14",
    "av<19",
    "faster-whisper>=1.1.0",
    "protobuf>=6.33.5",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "oatschema[validate]>=0.8.0.2,<0.9",
]

[project.entry-points."dorsal.models"]
dorsal_whisper = "dorsal_whisper"

[tool.hatch.build.targets.wheel]
packages = ["dorsal_whisper"]

[tool.hatch.build.targets.wheel.force-include]
"model_config.toml" = "dorsal_whisper/model_config.toml"

[tool.pytest.ini_options]
addopts = "-m 'not weights'"
markers = [
    "weights: downloads real Whisper weights from Hugging Face; run with `pytest -m weights`",
]
filterwarnings = [
    "ignore:The schema id 'open/audio-transcription' is deprecated:DeprecationWarning",
]
